<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer de 5 minutos · Club de Monetización</title>
<meta name="description" content="Pausa de 5 minutos entre las partes de la clase, con recordatorios animados del Club.">
<meta name="theme-color" content="#05091a">
<link rel="icon" href="/branding/app-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* La identidad del Club: azul noche, los cuatro dorados y el azul eléctrico.
     El dorado lleva texto oscuro (#1a1200): con blanco no se lee. */
  :root {
    --noche: #05091a;
    --noche-2: #0a1230;
    --oro-claro: #ffd97d;
    --oro: #e8c060;
    --oro-medio: #c9a040;
    --oro-oscuro: #9b7520;
    --azul: #2468ff;
    --texto-oro: #1a1200;
    --tinta: #f4f6ff;
    --tinta-2: rgba(232, 236, 255, .74);
    --tinta-3: rgba(232, 236, 255, .48);
    --borde: rgba(255, 217, 125, .16);
    --titulos: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    --cada: 10s; /* lo que dura cada recomendación en pantalla */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--noche);
    color: var(--tinta);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  /* ── Fondo: las dos auroras del Club ── */
  .fondo { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .fondo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 120%, rgba(36,104,255,.16), transparent 70%),
      linear-gradient(180deg, var(--noche) 0%, var(--noche-2) 100%);
  }
  .aurora { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .aurora.a { width: 62vmax; height: 62vmax; left: -18vmax; top: -24vmax;
    background: radial-gradient(circle, rgba(36,104,255,.55), transparent 65%); animation: flota-a 22s ease-in-out infinite alternate; }
  .aurora.b { width: 54vmax; height: 54vmax; right: -16vmax; bottom: -22vmax;
    background: radial-gradient(circle, rgba(201,160,64,.42), transparent 65%); animation: flota-b 26s ease-in-out infinite alternate; }
  @keyframes flota-a { to { transform: translate(10vmax, 8vmax) scale(1.12); } }
  @keyframes flota-b { to { transform: translate(-9vmax, -7vmax) scale(1.1); } }
  .rejilla {
    position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  }

  /* ── Estructura ── */
  .pagina {
    position: relative; z-index: 1; height: 100%;
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    padding: clamp(14px, 2.2vw, 34px) clamp(16px, 3.4vw, 60px);
    gap: clamp(12px, 2vh, 22px);
  }
  .barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .marca { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .marca img { width: clamp(34px, 3vw, 46px); height: auto; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,217,125,.55), 0 8px 24px rgba(0,0,0,.4); }
  .marca span { font-family: var(--titulos); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; font-size: clamp(.68rem, .9vw, .82rem); color: var(--oro-claro); }
  .acciones { display: flex; gap: 8px; transition: opacity .5s; }
  .icono {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 100px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: var(--tinta-2);
    font-size: .82rem; text-decoration: none; transition: color .2s, border-color .2s, background .2s;
  }
  .icono:hover { color: #fff; border-color: rgba(255,217,125,.5); background: rgba(255,217,125,.08); }
  .icono svg { width: 17px; height: 17px; }
  .icono.solo { width: 40px; padding: 0; justify-content: center; }

  .escena {
    display: grid; grid-template-columns: minmax(260px, .62fr) minmax(0, 1.7fr);
    gap: clamp(18px, 3vw, 56px); align-items: stretch;
    max-width: 1760px; width: 100%; margin: 0 auto; min-height: 0;
  }

  /* ── Columna del reloj ── */
  .reloj { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(12px, 2.2vh, 24px); min-width: 0; }
  .rotulo {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 12px; border-radius: 100px;
    background: rgba(255,217,125,.08); border: 1px solid rgba(255,217,125,.3);
    color: var(--oro-claro); font-size: clamp(.68rem, .9vw, .84rem); font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  }
  .rotulo i { width: 9px; height: 9px; border-radius: 50%; background: var(--oro-claro); }
  body.corriendo .rotulo i { animation: late 1.6s ease-out infinite; }
  @keyframes late { 0% { box-shadow: 0 0 0 0 rgba(255,217,125,.6); } 100% { box-shadow: 0 0 0 12px rgba(255,217,125,0); } }
  .titulo { font-family: var(--titulos); font-weight: 700; line-height: 1; letter-spacing: -.025em; font-size: clamp(2rem, 3.4vw, 3.8rem); }
  .titulo em {
    font-style: normal;
    background: linear-gradient(100deg, var(--oro-claro), var(--oro) 40%, var(--oro-medio) 75%, var(--oro-claro));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitulo { margin-top: -6px; font-size: clamp(.9rem, 1.1vw, 1.08rem); color: var(--tinta-2); }

  .anillo { --tam: min(34vh, 21vw); position: relative; width: var(--tam); aspect-ratio: 1; margin-top: clamp(4px, 1vh, 12px); }
  .anillo svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .pista { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 8; }
  .arco { fill: none; stroke: url(#oro); stroke-width: 8; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(255,217,125,.45)); }
  .halo {
    position: absolute; inset: 10%; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, rgba(255,217,125,.10), rgba(10,18,48,.55) 60%, rgba(5,9,26,.8));
    border: 1px solid var(--borde);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 60px rgba(0,0,0,.45);
  }
  .lectura { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tiempo {
    font-family: var(--titulos); font-weight: 700; line-height: 1; letter-spacing: -.02em;
    font-size: calc(var(--tam) * .26); font-variant-numeric: tabular-nums; color: #fff; transition: color .4s;
  }
  .estado { margin-top: .7em; font-size: clamp(.6rem, .8vw, .78rem); letter-spacing: .22em; text-transform: uppercase; color: var(--tinta-3); }

  .mandos { display: flex; align-items: center; gap: 16px; transition: opacity .5s; }
  .play {
    width: clamp(62px, 5.4vw, 80px); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; color: var(--texto-oro);
    background: linear-gradient(145deg, var(--oro-claro), var(--oro) 45%, var(--oro-medio));
    box-shadow: 0 0 0 6px rgba(255,217,125,.12), 0 14px 40px rgba(201,160,64,.45);
    transition: transform .2s, box-shadow .2s;
  }
  .play:hover { transform: scale(1.06); box-shadow: 0 0 0 9px rgba(255,217,125,.16), 0 18px 48px rgba(201,160,64,.55); }
  body.listo .play { animation: llama 2s ease-in-out infinite; }
  @keyframes llama { 50% { box-shadow: 0 0 0 14px rgba(255,217,125,.08), 0 14px 40px rgba(201,160,64,.55); } }
  .play svg { width: 40%; height: 40%; }
  .play .i-pausa { display: none; }
  body.corriendo .play .i-play { display: none; }
  body.corriendo .play .i-pausa { display: block; }
  .secundario {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: var(--tinta-2);
    transition: color .2s, border-color .2s;
  }
  .secundario:hover { color: #fff; border-color: rgba(255,217,125,.5); }
  .secundario svg { width: 19px; height: 19px; }
  .pista-teclas { font-size: .74rem; line-height: 1.9; color: var(--tinta-3); transition: opacity .5s; }
  .pista-teclas kbd { font-family: inherit; font-size: .7rem; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); color: var(--tinta-2); }

  /* ── El escenario de las recomendaciones ── */
  .escenario {
    position: relative; min-height: 0; overflow: hidden; border-radius: 30px;
    background:
      radial-gradient(70% 60% at 50% 40%, rgba(36,104,255,.22), transparent 70%),
      linear-gradient(160deg, rgba(24,38,98,.7), rgba(8,14,38,.85));
    border: 1px solid rgba(255,217,125,.24);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .segmentos { position: absolute; z-index: 3; top: 20px; left: 26px; right: 26px; display: flex; gap: 8px; }
  .segmentos button { flex: 1; height: 16px; display: flex; align-items: center; }
  .segmentos i { display: block; width: 100%; height: 5px; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,.14); }
  .segmentos b { display: block; height: 100%; background: linear-gradient(90deg, var(--oro-medio), var(--oro-claro)); transform: scaleX(0); transform-origin: left; }
  .segmentos .hecho b { transform: scaleX(1); }
  .segmentos .on b { animation: llena var(--cada) linear forwards; animation-play-state: paused; }
  body.corriendo .segmentos .on b { animation-play-state: running; }
  @keyframes llena { to { transform: scaleX(1); } }

  .diapo {
    position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto;
    padding: 46px clamp(20px, 3vw, 52px) clamp(22px, 3.6vh, 44px);
    opacity: 0; transform: translateY(80px); pointer-events: none;
    transition: transform 1s cubic-bezier(.65, 0, .25, 1), opacity .8s ease;
  }
  .diapo.on { opacity: 1; transform: none; pointer-events: auto; }
  .diapo.sale { opacity: 0; transform: translateY(-80px); }
  .ilus { min-height: 0; display: flex; align-items: center; justify-content: center; }
  .ilus svg { width: 100%; height: 100%; overflow: visible; }
  .texto { text-align: center; max-width: 980px; margin: 0 auto; }
  .texto > * { opacity: 0; transform: translateY(18px); }
  .diapo.on .texto > * { animation: sube .8s cubic-bezier(.2, .7, .2, 1) forwards; }
  .diapo.on .texto > :nth-child(2) { animation-delay: .12s; }
  .diapo.on .texto > :nth-child(3) { animation-delay: .24s; }
  @keyframes sube { to { opacity: 1; transform: none; } }
  .texto small {
    display: inline-block; font-size: clamp(.72rem, .95vw, .92rem); letter-spacing: .24em; text-transform: uppercase;
    color: var(--texto-oro); font-weight: 700; padding: 6px 14px; border-radius: 100px;
    background: linear-gradient(145deg, var(--oro-claro), var(--oro-medio));
  }
  .texto h2 {
    margin-top: clamp(10px, 1.6vh, 18px); font-family: var(--titulos); font-weight: 700; letter-spacing: -.02em;
    line-height: 1.02; font-size: clamp(2rem, 4.2vw, 4.6rem);
  }
  .texto p { margin-top: clamp(8px, 1.2vh, 14px); font-size: clamp(1rem, 1.55vw, 1.6rem); line-height: 1.4; color: var(--tinta-2); }
  .ruta { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; margin-top: clamp(10px, 1.6vh, 16px); }
  .ruta span { padding: 6px 16px; border-radius: 100px; font-size: clamp(.95rem, 1.4vw, 1.4rem); font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #fff; }
  .ruta span:last-child { background: rgba(255,217,125,.16); border-color: rgba(255,217,125,.5); color: var(--oro-claro); }
  .ruta i { font-style: normal; font-size: 1.3em; color: var(--oro); }

  /* ── Los personajes ── */
  .piel { fill: #f2c39b; }
  .cuello { fill: #e0a87e; }
  .pelo { fill: #2a1d14; }
  .camisa { fill: #2468ff; }
  .pantalon { fill: #1a2550; }
  .zapato { fill: #0c1230; }
  .mejilla { fill: #ff8a7a; opacity: .35; }
  .ojos ellipse { fill: #1b1a2e; }
  .ojo-c, .boca { fill: none; stroke: #7a3324; stroke-width: 2.8; stroke-linecap: round; }
  .boca-a { fill: #7a3324; }
  .manga { fill: none; stroke: #2468ff; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
  .cuello-camisa { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .sombra { fill: rgba(0,0,0,.3); }
  .resplandor { fill: rgba(255,217,125,.07); }
  .parpadeo { transform-box: fill-box; transform-origin: center; animation: parpadea 3.6s infinite; }
  @keyframes parpadea { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  /* Toma notas: escribe línea por línea; se le prende el foco */
  .n-linea { fill: none; stroke: #2468ff; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 80; stroke-dashoffset: 80; }
  .viva .n-l1 { animation: n-l1 4.2s linear infinite; }
  .viva .n-l2 { animation: n-l2 4.2s linear infinite; }
  .viva .n-l3 { animation: n-l3 4.2s linear infinite; }
  @keyframes n-l1 { 0% { stroke-dashoffset: 80; opacity: 1; } 30%, 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes n-l2 { 0%, 33.3% { stroke-dashoffset: 80; opacity: 1; } 63.3%, 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes n-l3 { 0%, 66.6% { stroke-dashoffset: 80; opacity: 1; } 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .viva .n-brazo { animation: n-barre 1.4s ease-in-out infinite; }
  @keyframes n-barre { 0% { transform: rotate(22deg); } 88% { transform: rotate(-22deg); } 100% { transform: rotate(22deg); } }
  .viva .n-mano { animation: n-garabato .14s linear infinite alternate; }
  @keyframes n-garabato { from { transform: translateY(-1.6px); } to { transform: translateY(1.6px); } }
  .viva .n-cabeza { animation: asiente 2.1s ease-in-out infinite; }
  @keyframes asiente { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(1px); } }
  .n-foco { opacity: 0; }
  .viva .n-foco { animation: n-foco 4.2s ease-out infinite; }
  @keyframes n-foco { 0%, 62% { opacity: 0; transform: scale(.3); } 70% { opacity: 1; transform: scale(1.15); } 76%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
  .viva .n-rayos { animation: n-rayos .6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes n-rayos { to { transform: scale(1.12); } }
  .n-vapor path { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 3; stroke-linecap: round; opacity: 0; }
  .viva .n-vapor path { animation: vapor 2.4s ease-out infinite; }
  .viva .n-vapor path:nth-child(2) { animation-delay: 1.2s; }
  @keyframes vapor { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-16px); } }

  /* Toma agua: se sirve del garrafón y se la toma */
  .viva .a-hombro { animation: a-hombro 5s ease-in-out infinite; }
  .viva .a-codo { animation: a-codo 5s ease-in-out infinite; }
  .viva .a-vaso { animation: a-vaso 5s ease-in-out infinite; }
  @keyframes a-hombro { 0%, 44% { transform: rotate(0); } 58%, 80% { transform: rotate(109deg); } 92%, 100% { transform: rotate(0); } }
  @keyframes a-codo { 0%, 44% { transform: rotate(0); } 58%, 80% { transform: rotate(130deg); } 92%, 100% { transform: rotate(0); } }
  @keyframes a-vaso { 0%, 44% { transform: rotate(0); } 58%, 80% { transform: rotate(-209deg); } 92%, 100% { transform: rotate(0); } }
  .a-agua { transform: scaleY(0); }
  .viva .a-agua { animation: a-agua 5s linear infinite; }
  @keyframes a-agua { 0%, 6% { transform: scaleY(0); } 40%, 58% { transform: scaleY(.85); } 78% { transform: scaleY(.06); } 90%, 100% { transform: scaleY(0); } }
  .a-chorro { opacity: 0; }
  .viva .a-chorro { animation: a-chorro 5s linear infinite; }
  @keyframes a-chorro { 0%, 3% { opacity: 0; transform: scaleY(0); } 7%, 37% { opacity: 1; transform: scaleY(1); } 42%, 100% { opacity: 0; transform: scaleY(1); } }
  .viva .a-cabeza { animation: a-cabeza 5s ease-in-out infinite; }
  @keyframes a-cabeza { 0%, 50%, 90%, 100% { transform: rotate(0); } 60%, 78% { transform: rotate(5deg); } }
  .a-cerrados { opacity: 0; }
  .viva .a-abiertos { animation: a-abiertos 5s step-end infinite; }
  .viva .a-cerrados { animation: a-cerrados 5s step-end infinite; }
  @keyframes a-abiertos { 0% { opacity: 1; } 57% { opacity: 0; } 81% { opacity: 1; } }
  @keyframes a-cerrados { 0% { opacity: 0; } 57% { opacity: 1; } 81% { opacity: 0; } }
  .a-ahh, .a-gotas { opacity: 0; }
  .viva .a-ahh { animation: a-ahh 5s ease-out infinite; }
  @keyframes a-ahh { 0%, 80% { opacity: 0; transform: scale(.4); } 85% { opacity: 1; transform: scale(1.08); } 89%, 97% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
  .viva .a-gotas { animation: a-gotas 5s ease-out infinite; }
  @keyframes a-gotas { 0%, 80% { opacity: 0; transform: translateY(6px); } 86% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  .a-burbuja { fill: rgba(220,240,255,.75); opacity: 0; }
  .viva .a-burbuja { animation: burbuja 1.8s ease-in infinite; }
  .viva .a-burbuja:nth-of-type(2) { animation-delay: .6s; }
  .viva .a-burbuja:nth-of-type(3) { animation-delay: 1.2s; }
  @keyframes burbuja { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-58px); } }

  /* Clases grabadas: la está viendo en la compu */
  .g-avance { transform: scaleX(0); }
  .viva .g-avance { animation: g-avance 9s linear infinite; }
  @keyframes g-avance { to { transform: scaleX(1); } }
  .viva .g-cabezal { animation: g-cabezal 9s linear infinite; }
  @keyframes g-cabezal { to { transform: translateX(210px); } }
  .viva .g-mano { animation: g-mano 1.4s ease-in-out infinite alternate; }
  @keyframes g-mano { from { transform: rotate(-18deg); } to { transform: rotate(16deg); } }
  .viva .g-profe { animation: g-profe 2.8s ease-in-out infinite; }
  @keyframes g-profe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px) rotate(-1.5deg); } }
  .viva .g-barra { animation: g-barra 2.4s ease-in-out infinite alternate; }
  .viva .g-barra:nth-of-type(2) { animation-delay: .4s; }
  .viva .g-barra:nth-of-type(3) { animation-delay: .8s; }
  .viva .g-barra:nth-of-type(4) { animation-delay: 1.2s; }
  @keyframes g-barra { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
  .viva .g-rec { animation: g-rec 1s step-end infinite; }
  @keyframes g-rec { 50% { opacity: .2; } }
  .g-reac { opacity: 0; }
  .viva .g-reac { animation: g-reac 3s ease-out infinite; }
  .viva .g-reac.r2 { animation-delay: 1s; }
  .viva .g-reac.r3 { animation-delay: 2s; }
  @keyframes g-reac { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; transform: translateY(-10px) scale(1); } 100% { opacity: 0; transform: translateY(-62px) scale(.9); } }
  .viva .g-cabeza { animation: asiente 1.6s ease-in-out infinite; }
  .viva .g-clic { animation: g-clic 2.2s ease-in-out infinite; }
  @keyframes g-clic { 0%, 40%, 52%, 100% { transform: translate(0, 0); } 46% { transform: translate(0, 2px); } 70% { transform: translate(-4px, 1px); } }
  .g-pop { opacity: 0; }
  .viva .g-pop { animation: g-pop 2.4s ease-out infinite; }
  .viva .g-pop.p2 { animation-delay: .8s; }
  .viva .g-pop.p3 { animation-delay: 1.6s; }
  @keyframes g-pop { 0%, 20% { opacity: 0; transform: translate(0, 0); } 25% { opacity: 1; } 55% { transform: translate(calc(var(--x) * .6), -34px) rotate(160deg); opacity: 1; } 90% { transform: translate(var(--x), -6px) rotate(320deg); opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), -6px); } }

  /* Activa tu cuenta: prende el interruptor, se abre el regalo y salta */
  .viva .c-perilla { animation: c-perilla 5s ease-in-out infinite; }

  var CONSEJOS = [
    { escena: 'notas', rotulo: 'Toma notas', titulo: 'Apunta lo más importante',
      texto: 'Repasa lo que llevamos y anota tus dudas para la segunda parte.' },
    { escena: 'agua', rotulo: 'Hidrátate', titulo: 'Ve por un vaso de agua',
      texto: 'Levántate, estírate un poco y regresa con energía.' },
    { escena: 'grabadas', rotulo: 'Las clases quedan grabadas', titulo: 'Repítela cuando quieras',
      ruta: ['Skool', 'Cursos', 'Clases grabadas y repeticiones'] },
    { escena: 'cuenta', rotulo: 'No lo olvides', titulo: 'Activa tu cuenta',
      texto: 'Actívala y recibe tu regalo del Club.' },
    { escena: 'vista', rotulo: 'Descansa la vista', titulo: 'Mira a lo lejos',
      texto: 'Despega los ojos de la pantalla unos segundos: tu vista también necesita su pausa.' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body, tiempo = $('tiempo'), estado = $('estado'), arco = $('arco'), barra = $('barra'), bPlay = $('bPlay');
  var CIRC = 2 * Math.PI * 94;
  arco.style.strokeDasharray = CIRC;

  // ── Las recomendaciones: una escena animada cada una, pasan solas ──
  var N = CONSEJOS.length, k = 0;
  $('diapos').innerHTML = CONSEJOS.map(function (c) {
    var detalle = c.ruta
      ? '<div class="ruta">' + c.ruta.map(function (r) { return '<span>' + r + '</span>'; }).join('<i>›</i>') + '</div>'
      : '<p>' + c.texto + '</p>';
    return '<article class="diapo" aria-hidden="true">' +
      '<div class="ilus"><svg viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + ESCENAS[c.escena] + '</svg></div>' +
      '<div class="texto"><small>' + c.rotulo + '</small><h2>' + c.titulo + '</h2>' + detalle + '</div></article>';
  }).join('');
  $('segmentos').innerHTML = CONSEJOS.map(function (c, i) {
    return '<button data-i="' + i + '" aria-label="' + c.rotulo + '"><i><b></b></i></button>';
  }).join('');
  var diapos = [].slice.call($('diapos').children);
  var segs = [].slice.call($('segmentos').children);

  function mostrar(n) {
    var antes = diapos[k];
    if (n !== k && antes.classList.contains('on')) {
      antes.classList.remove('on'); antes.classList.add('sale'); antes.setAttribute('aria-hidden', 'true');
      setTimeout(function () { if (!antes.classList.contains('on')) antes.classList.remove('sale', 'viva'); }, 1000);
    }
    k = n;
    var d = diapos[k];
    d.classList.remove('sale'); d.classList.add('on', 'viva'); d.setAttribute('aria-hidden', 'false');
    segs.forEach(function (s, i) { s.classList.toggle('hecho', i < k); s.classList.remove('on'); });
    void segs[k].offsetWidth; // reinicia la barrita del segmento
    segs[k].classList.add('on');
  }
  // Cuando se llena la barrita del aviso actual, pasa al siguiente.
  $('segmentos').addEventListener('animationend', function (e) {
    if (modo === 'corre' && e.target.parentNode.parentNode === segs[k]) mostrar((k + 1) % N);
  });
  $('segmentos').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) mostrar(+b.dataset.i);
  });

  // ── El temporizador ──
  // modo: 'listo' | 'corre' | 'pausa' | 'fin'. Se cuenta contra la hora de fin,
  // no sumando segundos: así no se atrasa aunque la pestaña quede en segundo plano.
  var modo = 'listo', resta = TOTAL, finEn = 0, cuadro = 0, alarma = 0, ultimo = '';
  mostrar(0);

  function formato(ms) {
    var s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function quedan() { return modo === 'corre' ? Math.max(0, finEn - performance.now()) : resta; }

  function pintar() {
    var ms = quedan(), p = ms / TOTAL;
    var txt = modo === 'fin' ? '¡Volvemos!' : formato(ms);
    if (txt !== ultimo) { tiempo.textContent = txt; ultimo = txt; document.title = (modo === 'corre' ? txt + ' · ' : '') + 'Timer de 5 minutos · Club de Monetización'; }
    arco.style.strokeDashoffset = modo === 'fin' ? 0 : CIRC * (1 - p);
    barra.style.transform = 'scaleX(' + (1 - p) + ')';
    body.classList.toggle('final', modo === 'corre' && ms <= 10000);
  }
  function bucle() {
    pintar();
    if (modo === 'corre') {
      if (quedan() <= 0) return terminar();
      cuadro = requestAnimationFrame(bucle);
    }
  }

  function textos(rotulo, titulo, sub, est) {
    $('rotulo').lastChild.textContent = rotulo;
    $('titulo').innerHTML = titulo;
    $('subtitulo').textContent = sub;
    estado.textContent = est;
  }
  function modoEn(m) {
    modo = m;
    body.classList.toggle('listo', m === 'listo');
    body.classList.toggle('corriendo', m === 'corre');
    body.classList.toggle('fin', m === 'fin');
    if (m !== 'corre') body.classList.remove('final', 'quieto');
  }

  function empezar() {
    if (modo === 'fin') reiniciar();
    preparaSonido();
    modoEn('corre');
    finEn = performance.now() + resta;
    clearTimeout(alarma);
    alarma = setTimeout(terminar, resta + 50);
    bPlay.setAttribute('aria-label', 'Pausar');
    textos('Interludio · 5 minutos', 'Una pequeña <em>pausa</em>', 'Volvemos en cuanto termine el tiempo.', 'Minutos de pausa');
    despierta(true);
    quieto();
    cancelAnimationFrame(cuadro); bucle();
  }
  function pausar() {
    resta = quedan();
    modoEn('pausa');
    clearTimeout(alarma); cancelAnimationFrame(cuadro);
    bPlay.setAttribute('aria-label', 'Seguir');
    estado.textContent = 'En pausa';
    despierta(false); pintar();
  }
  function reiniciar() {
    modoEn('listo'); resta = TOTAL;
    clearTimeout(alarma); cancelAnimationFrame(cuadro);
    bPlay.setAttribute('aria-label', 'Empezar');
    textos('Interludio · 5 minutos', 'Una pequeña <em>pausa</em>', 'Volvemos en cuanto termine el tiempo.', 'Pulsa play');
    mostrar(0); despierta(false); pintar();
  }
  function terminar() {
    if (modo !== 'corre') return;
    modoEn('fin'); resta = 0;
    clearTimeout(alarma); cancelAnimationFrame(cuadro);
    bPlay.setAttribute('aria-label', 'Empezar otra vez');
    textos('Se acabó la pausa', 'Retomamos <em>la clase</em>', 'Gracias por volver a tiempo.', 'Tiempo cumplido');
    despierta(false); pintar(); campana();
  }
  function alternar() { modo === 'corre' ? pausar() : empezar(); }

  // ── Pantalla completa ──
  function completa() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  // ── Los mandos se esconden mientras corre y no se mueve el ratón ──
  var reposo = 0;
  function quieto() {
    body.classList.remove('quieto'); clearTimeout(reposo);
    if (modo === 'corre') reposo = setTimeout(function () { body.classList.add('quieto'); }, 2600);
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, quieto, { passive: true }); });

  // ── Que la pantalla no se apague mientras corre ──
  var candado = null;
  function despierta(si) {
    try {
      if (si && navigator.wakeLock && !candado) navigator.wakeLock.request('screen').then(function (c) { candado = c; c.addEventListener('release', function () { candado = null; }); }).catch(function () {});
      else if (!si && candado) { candado.release(); candado = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && modo === 'corre') { despierta(true); bucle(); }
  });

  // ── Una campanita suave al terminar ──
  var conSonido = true, audio = null;
  try { conSonido = localStorage.getItem('timer_sonido') !== 'no'; } catch (e) {}
  var ICO_SON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  var ICO_MUDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
  function pintarSonido() {
    var b = $('bSonido');
    b.innerHTML = conSonido ? ICO_SON : ICO_MUDO;
    b.setAttribute('aria-pressed', String(conSonido));
    b.setAttribute('aria-label', conSonido ? 'Silenciar la campana' : 'Activar la campana');
  }
  function preparaSonido() {
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
  }
  function campana() {
    if (!conSonido || !audio) return;
    var t = audio.currentTime + .05;
    [659.25, 783.99, 1046.5].forEach(function (f, i) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * .28);
      g.gain.linearRampToValueAtTime(.22, t + i * .28 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .28 + 1.6);
      o.connect(g); g.connect(audio.destination);
      o.start(t + i * .28); o.stop(t + i * .28 + 1.7);
    });
  }
  pintarSonido();

  // ── Botones y teclado ──
  bPlay.addEventListener('click', alternar);
  $('bReiniciar').addEventListener('click', reiniciar);
  $('bCompleta').addEventListener('click', completa);
  $('bCompleta2').addEventListener('click', completa);
  $('bSonido').addEventListener('click', function () {
    conSonido = !conSonido; pintarSonido();
    try { localStorage.setItem('timer_sonido', conSonido ? 'si' : 'no'); } catch (e) {}
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.key.toLowerCase();
    if (t === ' ' || t === 'k') { e.preventDefault(); alternar(); }
    else if (t === 'enter' && document.activeElement === document.body) alternar();
    else if (t === 'r') reiniciar();
    else if (t === 'f') completa();
    else if (t === 'm') $('bSonido').click();
    else if (t === 'arrowright') mostrar((k + 1) % N);
    else if (t === 'arrowleft') mostrar((k - 1 + N) % N);
    quieto();
  });

  pintar();
